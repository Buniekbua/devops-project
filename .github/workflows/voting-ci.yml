name: Voting CI

on:
  push: 
    branches-ignore: [ main ]
    paths:
      - 'voting/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'voting/**'


jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./voting

    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build
        run: ./mvnw verify