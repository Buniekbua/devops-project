name: Recommendation CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'recommendation/**'


jobs:
  validate-and-test-Go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./recommendation

    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
            go-version: '1.20'
            cache-dependency-path: recommendation/go.sum

      - name: Install dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run Linter (Golangci-lint)
        # To jest standard w Go - wykrywa martwy kod, błędy i styl
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: ./recommendation

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...