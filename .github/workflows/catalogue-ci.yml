name: Catalogue CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'catalogue/**'


jobs:
  validate-and-test-Python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./catalogue

    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff pytest pytest-cov

      - name: Linting (Ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests & coverage
        run: |
          pytest --cov=. --cov-report=term-missing --cov-fail-under=75

      
        